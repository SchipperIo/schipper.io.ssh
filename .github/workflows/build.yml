name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build and test
        run: bash ./build.sh -t -p

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: dist/*
          if-no-files-found: error
